    runs-on: ubuntu-latest
   name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Build
        # This 'run' command enters your folder first
        run: |
          cd cash-dispatch
          npm install
          npm run build
        
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          # I plugged in your exact secret name below:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CASH_DISPATCH }}'
          projectId: cash-dispatch
          channelId: live
