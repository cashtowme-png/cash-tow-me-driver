<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cash Tow Me</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  background:#000;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.header {
  background:#1c1c1e;
  padding:20px;
  text-align:center;
  font-size:22px;
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
}

.loader {
  text-align:center;
  padding:20px;
  font-size:16px;
  color:#888;
}

.company-card {
  background:#1c1c1e;
  padding:15px;
  margin:15px 20px;
  border-radius:18px;
}

button, .call-btn {
  display:block;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  margin-top:10px;
  text-align:center;
  text-decoration:none;
}

.call-btn {
  background:#34c759;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  🚛 Cash Tow Me
</div>

<div class="loader" id="loader">Fetching nearby drivers...</div>

<div id="companyList"></div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "cash-dispatch.firebaseapp.com",
  projectId: "cash-dispatch",
  storageBucket: "cash-dispatch.appspot.com",
  messagingSenderId: "79166345159",
  appId: "1:79166345159:web:c763c3d806d2fc24db53e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function loadCompanies() {

  const container = document.getElementById("companyList");
  const loader = document.getElementById("loader");

  if (!navigator.geolocation) {
    loader.innerText = "GPS Required";
    return;
  }

  navigator.geolocation.getCurrentPosition(position => {

    const cLat = position.coords.latitude;
    const cLng = position.coords.longitude;

    db.collection("drivers")
      .where("approved", "==", true)
      .where("status", "==", "ON")
      .onSnapshot(snapshot => {

        loader.style.display = "none";
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = "<p style='text-align:center;padding:20px;'>No drivers nearby</p>";
          return;
        }

        const drivers = [];
        snapshot.forEach(doc => {
          const d = doc.data();
          if (!d.latitude || !d.longitude) return;

          const distance = Math.sqrt(Math.pow(d.latitude - cLat,2) + Math.pow(d.longitude - cLng,2)) * 69;
          if (distance <= 25) drivers.push({ id: doc.id, data: d, distance });
        });

        if (drivers.length === 0) {
