<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash Tow Me</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#000;
  color:white;
}
header {
  background:#2563eb;
  color:white;
  text-align:center;
  padding:25px;
  font-size:22px;
  font-weight:bold;
}
.container {
  padding:15px;
}
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}
.btn-driver { background:#16a34a; color:white; }
.btn-customer { background:#007bff; color:white; }
.card { background:#1c1c1e; padding:20px; border-radius:20px; margin-bottom:15px; }
input, select { width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:none; }
.call-btn { background:#34c759; color:white; text-align:center; display:block; padding:12px; border-radius:12px; margin-top:6px; text-decoration:none; }
#statusText, #gpsText { text-align:center; margin-top:8px; color:#ccc; }
</style>
</head>
<body>

<header>🚛 Cash Tow Me</header>
<div class="container">

  <!-- Role selection -->
  <div id="roleSelect" class="card">
    <button class="btn-customer" onclick="showCustomer()">🚗 Customer</button>
    <button class="btn-driver" onclick="showDriver()">🚛 Driver</button>
  </div>

  <!-- Customer App -->
  <div id="customerApp" style="display:none;">
    <div class="card">
      <h3>Select City</h3>
      <select id="city">
        <option value="Dallas">Dallas</option>
        <option value="Mesquite">Mesquite</option>
        <option value="Garland">Garland</option>
      </select>
      <button onclick="loadCustomerDrivers()">Find Drivers</button>
    </div>
    <div id="customerResults"></div>
  </div>

  <!-- Driver App -->
  <div id="driverApp" style="display:none;">
    <div class="card">
      <input id="name" placeholder="Driver Name">
      <input id="company" placeholder="Company Name">
      <input id="phone" placeholder="Phone Number">
      <input id="cityDriver" placeholder="City">
      <input id="services" placeholder="Services (Wheel Lift, Fuel, Flatbed)">
      <button onclick="saveDriver()">Save Profile</button>
      <button onclick="paySubscription('daily')">💳 Pay Daily</button>
      <button onclick="paySubscription('monthly')">💳 Pay Monthly</button>
    </div>

    <div class="card">
      <button id="toggleBtn" class="btn-driver" onclick="toggleStatus()">Go Online</button>
      <p id="statusText">Status: OFFLINE</p>
      <p id="gpsText">GPS: Not Active</p>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "cash-dispatch.firebaseapp.com",
  projectId: "cash-dispatch",
  storageBucket: "cash-dispatch.appspot.com",
  messagingSenderId: "79166345159",
  appId: "1:79166345159:web:c763c3d806d2fc24db53e2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// --- Role toggle ---
function showCustomer() {
  document.getElementById("roleSelect").style.display = "none";
  document.getElementById("customerApp").style.display = "block";
}
function showDriver() {
  document.getElementById("roleSelect").style.display = "none";
  document.getElementById("driverApp").style.display = "block";
}

// --- Customer ---
function loadCustomerDrivers() {
  const city = document.getElementById("city").value;
  const results = document.getElementById("customerResults");
  results.innerHTML = "Fetching nearby drivers...";

  db.collection("drivers")
    .where("approved","==",true)
    .where("status","==","ON")
    .onSnapshot(snapshot => {
      results.innerHTML = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        if(d.city !== city) return;
        const div = document.createElement("div");
        div.className="card";
        div.innerHTML = `<strong>${d.company || d.name}</strong><br>
                         🚛 ${d.services}<br>
                         📍 ${d.city}<br>
                         <a href="tel:${d.phone}" class="call-btn">📞 Call Driver</a>
                         <a href="sms:${d.phone}" class="call-btn">💬 Text Driver</a>`;
        results.appendChild(div);
      });
      if(results.innerHTML==="") results.innerHTML="<p>No drivers available in this city.</p>";
    });
}

// --- Driver ---
let driverId = localStorage.getItem("driverId");
let status = "OFF";
let watchId = null;

function saveDriver() {
  const name = document.getElementById("name").value;
  const company = document.getElementById("company").value;
  const phone = document.getElementById("phone").value;
  const cityDriver = document.getElementById("cityDriver").value;
  const services = document.getElementById("services").value;

  if(!name||!phone) return alert("Name and Phone required");

  if(driverId){
    db.collection("drivers").doc(driverId).update({name,company,phone,city:cityDriver,services});
    alert("Profile updated");
  } else {
    db.collection("drivers").add({name,company,phone,city:cityDriver,services,approved:false,paid:false,status:"OFF",latitude:null,longitude:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
      .then(doc=>{driverId=doc.id;localStorage.setItem("driverId",driverId);alert("Profile saved. Await admin approval & payment.");});
  }
}

function paySubscription(type){
  let url=type==='daily'?"https://buy.stripe.com/test_daily_link":"https://buy.stripe.com/test_monthly_link";
  window.open(url,"_blank");
}

function toggleStatus(){
  if(!driverId)return alert("Save profile first");
  db.collection("drivers").doc(driverId).get().then(doc=>{
    const data=doc.data();
    if(!data.paid||!data.approved)return alert("Must be approved and pay before going online");
    if(status==="OFF"){
      status="ON"; document.getElementById("toggleBtn").innerText="Go Offline"; startGPS();
      document.getElementById("statusText").innerText="Status: ONLINE";
    } else {
      status="OFF"; document.getElementById("toggleBtn").innerText="Go Online"; stopGPS();
      document.getElementById("statusText").innerText="Status: OFFLINE";
    }
    db.collection("drivers").doc(driverId).update({status});
  });
}

function startGPS(){
  if(!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    document.getElementById("gpsText").innerText=`GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    db.collection("drivers").doc(driverId).update({latitude:lat,longitude:lng});
  }, err=>alert("GPS error"), {enableHighAccuracy:true});
}

function stopGPS(){
  if(watchId) navigator.geolocation.clearWatch(watchId);
  watchId=null;
  document.getElementById("gpsText").innerText="GPS: Not Active";
}

// --- Service Worker for PWA ---
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>

</body>
</html>
