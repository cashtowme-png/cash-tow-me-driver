<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cash Tow Me – Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#0f0f0f;
  color:white;
  padding:20px;
}

h2 {
  margin-bottom:20px;
  text-align:center;
}

.card {
  background:#1c1c1e;
  padding:20px;
  border-radius:20px;
  margin-bottom:20px;
}

input {
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

button {
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

.btn-on { background:#16a34a; color:white; }
.btn-off { background:#dc2626; color:white; }
.btn-pay { background:#2563eb; color:white; }
</style>
</head>

<body>

<h2>🚛 Cash Tow Me – Driver</h2>

<!-- Profile Card -->
<div class="card">
  <input id="name" placeholder="Driver Name">
  <input id="company" placeholder="Company Name">
  <input id="phone" placeholder="Phone Number">
  <input id="city" placeholder="City">
  <input id="services" placeholder="Services (Flatbed, Winch)">
  <button onclick="saveDriver()">Save Profile</button>

  <!-- Stripe Payment Buttons -->
  <button class="btn-pay" onclick="paySubscription('daily')">💳 Pay Daily</button>
  <button class="btn-pay" onclick="paySubscription('monthly')">💳 Pay Monthly</button>
</div>

<!-- Online/Offline Toggle -->
<div class="card">
  <button id="toggleBtn" class="btn-on" onclick="toggleStatus()">Go Online</button>
  <p id="statusText">Status: OFFLINE</p>
  <p id="gpsText">GPS: Not Active</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "cash-dispatch.firebaseapp.com",
  projectId: "cash-dispatch",
  storageBucket: "cash-dispatch.appspot.com",
  messagingSenderId: "79166345159",
  appId: "1:79166345159:web:c763c3d806d2fc24db53e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let driverId = localStorage.getItem("driverId");
let status = "OFF";
let watchId = null;

// Save or update driver profile
function saveDriver() {
  const name = document.getElementById("name").value;
  const company = document.getElementById("company").value;
  const phone = document.getElementById("phone").value;
  const city = document.getElementById("city").value;
  const services = document.getElementById("services").value;

  if (!name || !phone) {
    alert("Name and phone required");
    return;
  }

  if (driverId) {
    db.collection("drivers").doc(driverId).update({
      name, company, phone, city, services
    });
    alert("Profile updated");
  } else {
    db.collection("drivers").add({
      name,
      company,
      phone,
      city,
      services,
      approved: false,
      paid: false,
      status: "OFF",
      latitude: null,
      longitude: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(doc => {
      driverId = doc.id;
      localStorage.setItem("driverId", driverId);
      alert("Profile saved. Await admin approval and payment.");
    });
  }
}

// Stripe Payment
function paySubscription(type) {
  let url = "";
  if (type === "daily") url = "https://buy.stripe.com/test_daily_link";
  if (type === "monthly") url = "https://buy.stripe.com/test_monthly_link";
  window.open(url, "_blank");
}

// Toggle online/offline with paid + approved check
function toggleStatus() {
  if (!driverId) {
    alert("Save profile first");
    return;
  }

  db.collection("drivers").doc(driverId).get().then(doc => {
    const data = doc.data();
    if (!data.paid || !data.approved) {
      alert("You must be approved and pay the subscription before going online.");
      return;
    }

    if (status === "OFF") {
      status = "ON";
      document.getElementById("toggleBtn").innerText = "Go Offline";
      document.getElementById("toggleBtn").className = "btn-off";
      document.getElementById("statusText").innerText = "Status: ONLINE";
      startGPS();
    } else {
      status = "OFF";
      document.getElementById("toggleBtn").innerText = "Go Online";
      document.getElementById("toggleBtn").className = "btn-on";
      document.getElementById("statusText").innerText = "Status: OFFLINE";
      stopGPS();
    }

    db.collection("drivers").doc(driverId).update({
      status: status
    });
  });
}

// Start GPS tracking
function startGPS() {
  if (!navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    document.getElementById("gpsText").innerText = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    db.collection("drivers").doc(driverId).update({ latitude: lat, longitude: lng });
  }, err => { alert("GPS error"); }, { enableHighAccuracy: true });
}

// Stop GPS
function stopGPS() {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  document.getElementById("gpsText").innerText = "GPS: Not Active";
}
</script>

</body>
</html>
