<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cash Tow Me – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#111;
  color:white;
  padding:20px;
}

h2 {
  margin-bottom:20px;
}

.driver-card {
  background:#1c1c1e;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-right:8px;
  margin-top:10px;
  cursor:pointer;
}

.btn-approve {
  background:#16a34a;
  color:white;
}

.btn-remove {
  background:#dc2626;
  color:white;
}

.status {
  font-size:13px;
  opacity:0.7;
}
</style>
</head>

<body>

<h2>🛠 Admin – Driver Approvals</h2>

<div id="driverList"></div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "cash-dispatch.firebaseapp.com",
  projectId: "cash-dispatch",
  storageBucket: "cash-dispatch.appspot.com",
  messagingSenderId: "79166345159",
  appId: "1:79166345159:web:c763c3d806d2fc24db53e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const container = document.getElementById("driverList");

function loadDrivers() {
  db.collection("drivers")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {

      container.innerHTML = "";

      snapshot.forEach(doc => {
        const d = doc.data();
        const id = doc.id;

        container.innerHTML += `
          <div class="driver-card">
            <strong>${d.company || "No Company"}</strong><br>
            ${d.name || ""}<br>
            📞 ${d.phone || ""}<br>
            📍 ${d.city || ""}<br>

            <div class="status">
              Status: ${d.status || "OFF"} |
              Approved: ${d.approved ? "YES" : "NO"} |
              Paid: ${d.paid ? "YES" : "NO"}
            </div>

            <button class="btn-approve" onclick="toggleApprove('${id}', ${d.approved})" ${!d.paid ? "disabled style='opacity:0.5'" : ""}>
              ${d.approved ? "Unapprove" : "Approve"}
            </button>

            <button class="btn-remove" onclick="deleteDriver('${id}')">
              Delete
            </button>
          </div>
        `;
      });

    });
}

function toggleApprove(id, currentStatus) {
  db.collection("drivers").doc(id).update({
    approved: !currentStatus
  });
}

function deleteDriver(id) {
  if (confirm("Delete this driver?")) {
    db.collection("drivers").doc(id).delete();
  }
}

loadDrivers();
</script>

</body>
</html>
