<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cash Tow Me – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#111;
  color:white;
  padding:20px;
}

h2 {
  margin-bottom:20px;
}

.driver-card {
  background:#1c1c1e;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-right:8px;
  margin-top:10px;
  cursor:pointer;
}

.btn-approve {
  background:#16a34a;
  color:white;
}

.btn-remove {
  background:#dc2626;
  color:white;
}

.status {
  font-size:13px;
  opacity:0.7;
}
</style>
</head>

<body>

<h2>🛠 Admin – Driver Approvals</h2>

container.innerHTML += `
  <div class="driver-card">
    <strong>${d.company || "No Company"}</strong><br>
    ${d.name || ""}<br>
    📞 ${d.phone || ""}<br>
    📍 ${d.city || ""}<br>

    <div class="status">
      Status: ${d.status || "OFF"} |
      Approved: ${d.approved ? "YES" : "NO"} |
      Paid: ${d.paid ? "YES" : "NO"}
    </div>

    <button class="btn-approve" onclick="toggleApprove('${id}', ${d.approved})" ${!d.paid ? "disabled style='opacity:0.5'" : ""}>
      ${d.approved ? "Unapprove" : "Approve"}
    </button>

    <button class="btn-remove" onclick="deleteDriver('${id}')">
      Delete
    </button>
  </div>
`;


<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "cash-dispatch.firebaseapp.com",
  projectId: "cash-dispatch",
  storageBucket: "cash-dispatch.appspot.com",
  messagingSenderId: "79166345159",
  appId: "1:79166345159:web:c763c3d806d2fc24db53e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const container = document.getElementById("driverList");

function loadDrivers() {
  db.collection("drivers")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {

      container.innerHTML = "";

      snapshot.forEach(doc => {

        const d = doc.data();
        const id = doc.id;

        container.innerHTML += `
         <div class="card">
  <input id="name" placeholder="Driver Name">
  <input id="company" placeholder="Company Name">
  <input id="phone" placeholder="Phone Number">
  <input id="city" placeholder="City">
  <input id="services" placeholder="Services (Flatbed, Winch)">
  <button onclick="saveDriver()">Save Profile</button>

  <!-- Stripe Payment Button -->
  <button onclick="paySubscription()"https://buy.stripe.com/test_00wcMY1ze3ul1EE6Wp83C00">
  💳 Pay Daily
  <button onclick="paySubscription()"https://buy.stripe.com/test_28EdR291G6Gx1EEfsV83C01">
  💳 Pay Monthly
  </button>
</div>


            <div class="status">
              Status: ${d.status || "OFF"} |
              Approved: ${d.approved ? "YES" : "NO"}
            </div>

            <button class="btn-approve" onclick="toggleApprove('${id}', ${d.approved})">
              ${d.approved ? "Unapprove" : "Approve"}
            </button>

            <button class="btn-remove" onclick="deleteDriver('${id}')">
              Delete
            </button>
          </div>
        `;

      });

    });
}

function toggleStatus() {
  if (!driverId) {
    alert("Save profile first");
    return;
  }

  db.collection("drivers").doc(driverId).get().then(doc => {
    const data = doc.data();

    if (!data.paid || !data.approved) {
      alert("You must be approved and pay the subscription before going online.");
      return;
    }

    // Proceed to toggle status
    if (status === "OFF") {
      status = "ON";
      document.getElementById("toggleBtn").innerText = "Go Offline";
      document.getElementById("toggleBtn").className = "btn-off";
      document.getElementById("statusText").innerText = "Status: ONLINE";
      startGPS();
    } else {
      status = "OFF";
      document.getElementById("toggleBtn").innerText = "Go Online";
      document.getElementById("toggleBtn").className = "btn-on";
      document.getElementById("statusText").innerText = "Status: OFFLINE";
      stopGPS();
    }

    db.collection("drivers").doc(driverId).update({
      status: status
    });
  });
}
function paySubscription() {
  const stripeURL = "https://https://buy.stripe.com/test_5kQ3co5Pu0i9832cgJ83C02";
  window.open(stripeURL, "_blank");
}


loadDrivers();
</script>

</body>
</html>
